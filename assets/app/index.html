<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原图批注</title><link rel="stylesheet" href="/style.css"></head><body>
<div id="pages" aria-label="原始文档页面"></div>

<div id="pager-dock"><div id="turn-pages" role="toolbar" aria-label="翻页与工具"><button id="toolkit-toggle" aria-label="打开全部工具" title="工具包" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><div id="tool-drawer" hidden><div id="tools" role="toolbar" aria-label="批注工具"><div class="tool-group"><button id="select-tool" title="选中文字" aria-label="选中文字" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M5 3l14 10-7 1-3 7z"/></svg><span class="tool-label">选字</span></button><button id="point-tool" title="加点点：点击或拖动" aria-label="加点点" aria-pressed="true"><svg viewBox="0 0 24 24"><circle cx="7" cy="7" r="2"/><circle cx="16" cy="6" r="2"/><circle cx="12" cy="16" r="3"/><path d="M12 10v12M6 16h12"/></svg><span class="tool-label">加点点</span></button><button id="pan-tool" title="平移画布" aria-label="平移画布"><svg viewBox="0 0 24 24"><path d="M8 12V5a2 2 0 014 0v6M12 11V4a2 2 0 014 0v8M16 10V7a2 2 0 014 0v8c0 5-3 7-6 7h-2c-2 0-3-1-4-3l-4-6a2 2 0 013-2l3 3V9"/></svg><span class="tool-label">移动</span></button><button id="eraser-tool" title="橡皮擦：点一下擦除" aria-label="橡皮擦" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 14L13 3l8 8-10 10H8zM7 10l8 8M11 21h11"/></svg><span class="tool-label">橡皮擦</span></button></div><div class="tool-group"><button id="language-tool" title="右侧展开中文对照" aria-label="右侧展开中文对照" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 4h12M9 2v2M5 5c0 6 3 9 8 11M13 5c0 6-3 9-10 12M13 22l4-12 4 12M14 18h6"/></svg><span class="tool-label">中文对照</span></button><button id="links-tool" title="显示全部连线" aria-label="显示全部连线" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span class="tool-label">显示连线</span></button><button id="zoom-in" title="放大" aria-label="放大"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="M15 15l6 6M6 10h8M10 6v8"/></svg><span class="tool-label">放大</span></button><button id="zoom-out" title="缩小" aria-label="缩小"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="M15 15l6 6M6 10h8"/></svg><span class="tool-label">缩小</span></button></div><div class="tool-group"><button id="undo-canvas" title="撤销标注 ⌘Z" aria-label="撤销标注"><svg viewBox="0 0 24 24"><path d="M8 4L3 9l5 5M3 9h10a6 6 0 010 12"/></svg><span class="tool-label">撤销</span></button><button id="redo-canvas" title="重做标注 ⇧⌘Z" aria-label="重做标注"><svg viewBox="0 0 24 24"><path d="M16 4l5 5-5 5M21 9H11a6 6 0 000 12"/></svg><span class="tool-label">重做</span></button></div><div class="tool-group"><button id="quote-tool" title="复制选中批注" aria-label="复制选中批注" disabled><svg viewBox="0 0 24 24"><path d="M5 5h6v7H5zM13 5h6v7h-6zM11 12c0 5-2 7-6 7M19 12c0 5-2 7-6 7"/></svg><span class="tool-label">复制批注</span></button><button id="tidy-tool" title="辅助线整理成手绘圈" aria-label="整理为手绘圈"><svg viewBox="0 0 24 24"><path d="M3 13C1 2 22 1 21 12S1 23 3 13M14 2l2 4M20 17l2 3"/></svg><span class="tool-label">整理圈线</span></button><button id="delete-tool" title="删除选中标注" aria-label="删除选中标注" disabled><svg viewBox="0 0 24 24"><path d="M5 6h14M9 6V3h6v3M7 6v15h10V6"/></svg><span class="tool-label">删除选中</span></button><button id="submit" title="导出当前画布为 PNG 图片" aria-label="导出图片"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="15" height="15" rx="2"/><circle cx="8" cy="8" r="1"/><path d="M4 16l5-5 4 4 3-3 2 2M20 13v9m-3-3 3 3 3-3"/></svg><span id="pending-dot" hidden></span><span class="tool-label">导出图片</span></button><button id="export-editable" title="导出可编辑 HTML（含原图与批注）" aria-label="导出可编辑文件"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v8M15 3v5h5M6 3v18h7M15 20l6-6 2 2-6 6h-2z"/></svg><span class="tool-label">可编辑文件</span></button></div><button id="draw-tool" hidden title="圈画或划线" aria-label="圈画或划线"><svg viewBox="0 0 24 24"><path d="M4 17L16 5l3 3L7 20H4zM14 7l3 3M3 22c5-2 9 1 17-2"/></svg></button><button id="voice-global" hidden title="语音批注" aria-label="语音批注"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0M12 17v5"/></svg></button></div></div><button id="previous" title="上一页" aria-label="上一页"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button id="next" title="下一页" aria-label="下一页"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div><button id="quote-canvas" aria-label="复制当前画布全部批注" title="复制原文位置和全部修改建议"><svg viewBox="0 0 24 24"><path d="M8 3h13v14H8zM3 8v13h13"/></svg></button></div>
<div id="note" hidden><div id="note-actions"><button id="voice" title="语音输入" aria-label="语音输入"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0M12 17v5M8 22h8"/></svg></button><button id="handwrite" title="手写批注" aria-label="手写批注"><svg viewBox="0 0 24 24"><path d="M3 20l4-1L21 5l-3-3L4 16zM16 4l4 4M4 22h17"/></svg></button><button id="undo" title="撤销一笔" aria-label="撤销一笔"><svg viewBox="0 0 24 24"><path d="M8 4L3 9l5 5M3 9h10a6 6 0 010 12"/></svg></button><button id="remove" title="删除这条" aria-label="删除这条"><svg viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/></svg></button><button id="close-note" title="收起批注" aria-label="收起批注"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div><textarea id="comment" rows="3" aria-label="修改意见"></textarea><canvas id="pad" hidden aria-label="手写修改意见"></canvas></div>
<aside id="recent-deleted" aria-label="最近删除"><header>最近删除 <small id="recent-count">0/2</small></header><ol id="recent-list"></ol></aside>
<section id="copy-result" hidden aria-label="整理后的复制内容"><button id="copy-close" aria-label="关闭复制内容">×</button><textarea id="copy-output" readonly aria-label="复制文本"></textarea><button id="copy-select">全选文本</button></section><div id="eraser-sweep" hidden aria-hidden="true"></div><div id="toast" hidden role="status" aria-live="polite"></div><script src="/copy-notes.js"></script><script src="/sweep.js"></script><script src="/attention.js"></script><script src="/history.js"></script><script src="/cards.js"></script><script src="/geometry.js"></script><script src="/app.js"></script></body></html>
